<!DOCTYPE html>
<html>
<head>

</head>
<body>
       <button onclick="openTabs()">Compare Items</button>

<script>
function openTabs() {
    const urls = [
        "https://www.example.com/item1",
        "https://www.example.com/item2"
    ];

    urls.forEach(url => {
        const newTab = document.createElement("a");
        newTab.href = url;
        newTab.target = "_blank";
        newTab.rel = "noopener";

        document.body.appendChild(newTab);
        newTab.click();
        newTab.remove();
    });
}
</script>
</script>
</body>
</html>
