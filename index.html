<!DOCTYPE html>

<body>
       <button onclick="openTabs()">Compare Items</button>

<script>
function openTabs() {
    const urls = [
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZ6vFT4334mrnNxWVWK3RFvOvN544eSuIiiiftABY9cLRVTZnzaiLY-QMX&s=10",
       "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZ6vFT4334mrnNxWVWK3RFvOvN544eSuIiiiftABY9cLRVTZnzaiLY-QMX&s=10",
       "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZ6vFT4334mrnNxWVWK3RFvOvN544eSuIiiiftABY9cLRVTZnzaiLY-QMX&s=10",
       "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZ6vFT4334mrnNxWVWK3RFvOvN544eSuIiiiftABY9cLRVTZnzaiLY-QMX&s=10",
       "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZ6vFT4334mrnNxWVWK3RFvOvN544eSuIiiiftABY9cLRVTZnzaiLY-QMX&s=10",
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZ6vFT4334mrnNxWVWK3RFvOvN544eSuIiiiftABY9cLRVTZnzaiLY-QMX&s=10"
    ];

    urls.forEach(url => {
        const newTab = document.createElement("a");
        newTab.href = url;
        newTab.target = "_blank";
        newTab.rel = "noopener";

        document.body.appendChild(newTab);
        newTab.click();
        newTab.remove();
    });
}
</script>
</script>
</body>
</html>
